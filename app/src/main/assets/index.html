<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rumah 3D Walkthrough Ultra-Detail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: system-ui, -apple-system, sans-serif; color: #f4f1ea; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hudBadge {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(14, 19, 29, 0.90); border: 1px solid rgba(255,255,255,0.16);
      padding: 10px 14px; border-radius: 12px; pointer-events: none;
    }
    #hudBadge .zone { font-size: 13px; font-weight: 700; color: #facc15; }
    #hudBadge .surf { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    #hudBadge .surf span { color: #7dd3fc; font-weight: 600; }

    #minimap {
      position: fixed; top: 14px; right: 14px; z-index: 20;
      background: rgba(14, 19, 29, 0.90); border: 1px solid rgba(255,255,255,0.16);
      padding: 6px; border-radius: 12px; pointer-events: none;
    }

    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: rgba(255,255,255,0.82); box-shadow: 0 0 6px rgba(0,0,0,0.85);
      z-index: 15; pointer-events: none;
    }

    #dockWrap {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 25; display: flex; flex-direction: column; align-items: center;
      max-width: 94vw;
    }
    #dockToggle {
      background: rgba(14, 19, 29, 0.94); color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.16); border-bottom: none;
      padding: 4px 12px; border-radius: 8px 8px 0 0; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    #dockBar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
      background: rgba(14, 19, 29, 0.94); border: 1px solid rgba(255,255,255,0.16);
      padding: 8px 12px; border-radius: 14px;
    }
    #dockBar.hidden { display: none; }
    .dock-btn {
      background: rgba(255,255,255,0.06); color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.16); padding: 6px 10px;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .dock-btn.active { border-color: #facc15; background: rgba(250, 204, 21, 0.2); color: #fef08a; }

    #joyZone {
      position: fixed; bottom: 72px; left: 22px; width: 112px; height: 112px;
      border-radius: 50%; background: rgba(14, 19, 29, 0.78);
      border: 2px solid rgba(250, 204, 21, 0.62); z-index: 22; touch-action: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    #joyKnob {
      position: absolute; top: 32px; left: 32px; width: 44px; height: 44px;
      border-radius: 50%; background: rgba(250, 204, 21, 0.92);
      border: 1px solid rgba(255, 250, 220, 0.65);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    #lookZone {
      position: fixed; top: 0; right: 0; width: 55vw; height: 100vh;
      z-index: 12; touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hudBadge">
    <div class="zone" id="zoneText">Zon 1 · Dapur</div>
    <div class="surf">Lantai: <span id="surfaceText">Jubin Berkilat</span></div>
  </div>

  <div id="minimap">
    <svg width="110" height="136" viewBox="0 0 120 150">
      <rect x="4" y="4" width="56" height="58" rx="3" fill="#1d2838" stroke="#475569" stroke-width="1" />
      <rect x="60" y="10" width="54" height="76" rx="3" fill="#2d2320" stroke="#7c5240" stroke-width="1" />
      <rect x="44" y="86" width="70" height="60" rx="3" fill="#222a33" stroke="#64748b" stroke-width="1" />
      <rect x="14" y="86" width="30" height="60" rx="3" fill="#1a1d21" stroke="#52525b" stroke-width="1" />
      <text x="32" y="34" text-anchor="middle" fill="#94a3b8" font-size="7" font-weight="700">TAMU</text>
      <text x="87" y="48" text-anchor="middle" fill="#e2a88c" font-size="7" font-weight="700">TENGAH</text>
      <text x="79" y="118" text-anchor="middle" fill="#cbd5e1" font-size="7" font-weight="700">DAPUR</text>
      <text x="29" y="118" text-anchor="middle" fill="#a1a1aa" font-size="6" font-weight="700">TEPI</text>
      <g id="mapPlayer" transform="translate(65, 110) rotate(180)">
        <polygon points="0,-9 -4,3 4,3" fill="#facc15" opacity="0.95" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
      </g>
    </svg>
  </div>

  <div id="crosshair"></div>
  <div id="joyZone"><div id="joyKnob"></div></div>
  <div id="lookZone"></div>

  <div id="dockWrap">
    <button id="dockToggle" type="button">▾ Tutup Kawalan (H)</button>
    <div id="dockBar">
      <button class="dock-btn active" data-zone="dapur">Dapur</button>
      <button class="dock-btn" data-zone="tengah">Ruang Tengah</button>
      <button class="dock-btn" data-zone="tamu">Ruang Tamu</button>
      <button class="dock-btn" data-zone="koridor">Koridor &amp; Bilik Air</button>
      <button class="dock-btn" id="btnMute" type="button">Audio: Hidup</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const isSoftwareGl = (() => {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl2') || c.getContext('webgl');
        if (!gl) return true;
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        const param = ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER;
        const gpu = String(gl.getParameter(param) || '');
        gl.getExtension('WEBGL_lose_context')?.loseContext();
        return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
      } catch {
        return true;
      }
    })();

    // =========================================================================
    // 1. RENDERER PBR + ROOM ENVIRONMENT + COMPOSER (SSAO & BLOOM)
    // =========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f17);
    scene.fog = new THREE.FogExp2(0x0b0f17, 0.018);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.08, 45);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({
      antialias: !isSoftwareGl,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    renderer.shadowMap.enabled = !isSoftwareGl;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.16;
    pmrem.dispose();

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    let composer = null;
    let ssaoPass = null;
    let bloomPass = null;
    if (!isSoftwareGl) {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
      ssaoPass.kernelRadius = 0.45;
      ssaoPass.minDistance = 0.0015;
      ssaoPass.maxDistance = 0.14;
      composer.addPass(ssaoPass);
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.10, 0.25, 1.02
      );
      composer.addPass(bloomPass);
    }

    // =========================================================================
    // 2. SISTEM TEKSTUR HIBRID 4K (hd_pack/ + FALLBACK 2048x2048 PROSEDURAL)
    // =========================================================================
    const texLoader = new THREE.TextureLoader();

    function seededRand(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function heightCanvasToNormalCanvas(heightCanvas, strength) {
      const w = heightCanvas.width, h = heightCanvas.height;
      const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w; outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');
      const outImg = outCtx.createImageData(w, h);
      const dst = outImg.data;
      const sample = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255.0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const nx = (sample(x - 1, y) - sample(x + 1, y)) * strength;
          const ny = (sample(x, y - 1) - sample(x, y + 1)) * strength;
          const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + 1.0);
          const idx = (y * w + x) * 4;
          dst[idx] = Math.round((nx * invLen * 0.5 + 0.5) * 255);
          dst[idx + 1] = Math.round((ny * invLen * 0.5 + 0.5) * 255);
          dst[idx + 2] = Math.round((invLen * 0.5 + 0.5) * 255);
          dst[idx + 3] = 255;
        }
      }
      outCtx.putImageData(outImg, 0, 0);
      return outCanvas;
    }

    function createHybridMaterial(hdKey, { repeatX = 1, repeatY = 1, roughness = 1.0, metalness = 0.02, normalScale = 3.2, draw }) {
      const size = 1024;
      const cA = document.createElement('canvas');
      const cB = document.createElement('canvas');
      const cR = document.createElement('canvas');
      cA.width = cB.width = cR.width = size;
      cA.height = cB.height = cR.height = size;
      draw(cA.getContext('2d'), cB.getContext('2d'), cR.getContext('2d'), size, size);
      const cN = heightCanvasToNormalCanvas(cB, normalScale);

      const map = new THREE.CanvasTexture(cA);
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = new THREE.CanvasTexture(cN);
      const roughnessMap = new THREE.CanvasTexture(cR);
      [map, normalMap, roughnessMap].forEach(t => {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatX, repeatY);
        t.anisotropy = maxAniso;
      });

      const mat = new THREE.MeshStandardMaterial({
        map,
        normalMap,
        normalScale: new THREE.Vector2(1.15, 1.15),
        roughnessMap,
        roughness,
        metalness
      });

      if (hdKey) {
        const tryMap = (suffix, assign) => {
          texLoader.load(
            `./hd_pack/${hdKey}_${suffix}.png`,
            (tex) => {
              tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
              tex.repeat.set(repeatX, repeatY);
              tex.anisotropy = maxAniso;
              if (suffix === 'albedo') tex.colorSpace = THREE.SRGBColorSpace;
              assign(tex);
              mat.needsUpdate = true;
            },
            undefined,
            () => {}
          );
        };
        tryMap('albedo', (t) => { mat.map = t; });
        tryMap('normal', (t) => { mat.normalMap = t; mat.normalScale.set(1.15, 1.15); });
        tryMap('roughness', (t) => { mat.roughnessMap = t; });
        tryMap('ao', (t) => { mat.aoMap = t; mat.aoMapIntensity = 0.85; });
      }
      return mat;
    }

    const contactShadowMat = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 6, 64, 64, 62);
      g.addColorStop(0, 'rgba(10, 12, 16, 0.55)');
      g.addColorStop(0.65, 'rgba(10, 12, 16, 0.22)');
      g.addColorStop(1, 'rgba(10, 12, 16, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, opacity: 0.52 });
    })();

    const makeTileMat = (rx, ry, roughVal) => createHybridMaterial('white_tile', {
      repeatX: rx, repeatY: ry, normalScale: 4.5,
      draw: (a, b, r, w, h) => {
        const rand = seededRand(101);
        a.fillStyle = '#c8cdc7'; a.fillRect(0, 0, w, h);
        b.fillStyle = '#ebebeb'; b.fillRect(0, 0, w, h);
        const rv = Math.round(roughVal * 255);
        r.fillStyle = `rgb(${rv},${rv},${rv})`; r.fillRect(0, 0, w, h);
        for (let i = 0; i < 3600; i++) {
          a.fillStyle = rand() > 0.5 ? 'rgba(165,172,166,0.14)' : 'rgba(220,224,218,0.10)';
          a.fillRect(rand() * w, rand() * h, 3 + rand() * 8, 3 + rand() * 8);
        }
        const step = w / 2;
        a.strokeStyle = '#6f756f'; a.lineWidth = 14;
        b.strokeStyle = '#181818'; b.lineWidth = 18;
        r.strokeStyle = '#ececec'; r.lineWidth = 18;
        for (let i = 0; i <= w; i += step) {
          for (const ctx of [a, b, r]) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
          }
        }
      }
    });

    const mats = {
      whiteTile: makeTileMat(6.5, 5.8, 0.34),
      livingTile: makeTileMat(5.5, 5.8, 0.26),
      terracottaGeo: createHybridMaterial('orange_terracotta', {
        repeatX: 4, repeatY: 6, normalScale: 4.8,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(202);
          a.fillStyle = '#c27456'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#b4b4b4'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#828282'; r.fillRect(0, 0, w, h);
          const grid = w / 2;
          for (let gx = 0; gx < 2; gx++) {
            for (let gy = 0; gy < 2; gy++) {
              const cx = gx * grid + grid / 2, cy = gy * grid + grid / 2;
              a.strokeStyle = '#8d432b'; a.lineWidth = 14;
              a.strokeRect(gx * grid + 12, gy * grid + 12, grid - 24, grid - 24);
              b.strokeStyle = '#323232'; b.lineWidth = 14;
              b.strokeRect(gx * grid + 12, gy * grid + 12, grid - 24, grid - 24);
              a.fillStyle = '#d48d6f'; b.fillStyle = '#e8e8e8';
              a.beginPath(); b.beginPath();
              for (let k = 0; k < 8; k++) {
                const ang = (k / 8) * Math.PI * 2 + Math.PI / 8;
                const px = cx + Math.cos(ang) * (grid * 0.31), py = cy + Math.sin(ang) * (grid * 0.31);
                k === 0 ? (a.moveTo(px, py), b.moveTo(px, py)) : (a.lineTo(px, py), b.lineTo(px, py));
              }
              a.closePath(); a.fill(); a.stroke();
              b.closePath(); b.fill(); b.stroke();
            }
          }
          for (let i = 0; i < 2500; i++) {
            a.fillStyle = `rgba(90,40,25,${rand() * 0.1})`;
            a.fillRect(rand() * w, rand() * h, 4, 4);
          }
        }
      }),
      subwayTile: createHybridMaterial('subway_tile', {
        repeatX: 4, repeatY: 2, normalScale: 5.5,
        draw: (a, b, r, w, h) => {
          a.fillStyle = '#c8cdc7'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#e8e8e8'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#484848'; r.fillRect(0, 0, w, h);
          const rows = 8, cols = 4, rh = h / rows, cw = w / cols;
          for (let row = 0; row < rows; row++) {
            const y = row * rh, offset = (row % 2) * (cw / 2);
            for (let col = -1; col <= cols; col++) {
              const x = col * cw + offset;
              a.fillStyle = '#cfd4ce'; a.fillRect(x + 6, y + 6, cw - 12, rh - 12);
              b.fillStyle = '#ffffff'; b.fillRect(x + 8, y + 8, cw - 16, rh - 16);
            }
            a.strokeStyle = '#6c726c'; a.lineWidth = 10;
            b.strokeStyle = '#181818'; b.lineWidth = 12;
            r.strokeStyle = '#e2e2e2'; r.lineWidth = 12;
            for (const ctx of [a, b, r]) {
              ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }
            for (let col = 0; col <= cols; col++) {
              const x = (col * cw + offset) % w;
              for (const ctx of [a, b, r]) {
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rh); ctx.stroke();
              }
            }
          }
        }
      }),
      leafWallpaper: createHybridMaterial('leaf_wallpaper', {
        repeatX: 3.5, repeatY: 2.2, normalScale: 2.6,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(303);
          a.fillStyle = '#cfd2c6'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#808080'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#c8c8c8'; r.fillRect(0, 0, w, h);
          a.strokeStyle = 'rgba(155,160,146,0.28)'; a.lineWidth = 2;
          for (let i = 0; i < w; i += 8) {
            a.beginPath(); a.moveTo(i, 0); a.lineTo(i, h); a.stroke();
            a.beginPath(); a.moveTo(0, i); a.lineTo(w, i); a.stroke();
          }
          for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
              const x = col * 204 + 96 + (rand() - 0.5) * 30;
              const y = row * 204 + 96 + (rand() - 0.5) * 30;
              const ang = (row + col) % 2 === 0 ? 0.52 : -0.46;
              for (const isB of [false, true]) {
                const ctx = isB ? b : a;
                ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
                ctx.strokeStyle = isB ? '#dcdcdc' : ((row + col) % 3 === 0 ? '#5b6b56' : '#3d473b');
                ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -55); ctx.lineTo(0, 55); ctx.stroke();
                ctx.lineWidth = 3;
                for (let s = -44; s <= 44; s += 11) {
                  const sp = 28 * (1 - Math.abs(s) / 70);
                  ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(-sp, s - 12); ctx.stroke();
                  ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(sp, s - 12); ctx.stroke();
                }
                ctx.restore();
              }
            }
          }
        }
      }),
      marble: createHybridMaterial('marble_vein', {
        repeatX: 2, repeatY: 2, normalScale: 1.5, metalness: 0.03,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(404);
          a.fillStyle = '#d3d7d1'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#d4d4d4'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#383838'; r.fillRect(0, 0, w, h);
          for (let v = 0; v < 22; v++) {
            a.strokeStyle = `rgba(88,98,106,${0.18 + rand() * 0.25})`;
            a.lineWidth = 3 + rand() * 10;
            b.strokeStyle = 'rgba(155,155,155,0.45)'; b.lineWidth = a.lineWidth;
            let x = rand() * w, y = 0;
            a.beginPath(); a.moveTo(x, y); b.beginPath(); b.moveTo(x, y);
            while (y < h) { y += 44; x += (rand() - 0.5) * 90; a.lineTo(x, y); b.lineTo(x, y); }
            a.stroke(); b.stroke();
          }
        }
      }),
      flutedSlat: createHybridMaterial('fluted_wood', {
        repeatX: 1, repeatY: 1, normalScale: 2.6,
        draw: (a, b, r, w, h) => {
          a.fillStyle = '#58544b'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#909090'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#929292'; r.fillRect(0, 0, w, h);
        }
      }),
      woodDark: createHybridMaterial('dark_wood', {
        repeatX: 1, repeatY: 1, normalScale: 2.8,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(501);
          a.fillStyle = '#4f2e18'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#929292'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#707070'; r.fillRect(0, 0, w, h);
          for (let i = 0; i < 160; i++) {
            const y = rand() * h;
            a.strokeStyle = '#261307'; a.globalAlpha = 0.25; a.lineWidth = 2 + rand() * 5;
            a.beginPath(); a.moveTo(0, y); a.lineTo(w, y); a.stroke();
          }
          a.globalAlpha = 1;
        }
      }),
      woodMedium: createHybridMaterial('dark_wood', {
        repeatX: 1, repeatY: 1, normalScale: 2.8,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(502);
          a.fillStyle = '#814e26'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#929292'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#7a7a7a'; r.fillRect(0, 0, w, h);
          for (let i = 0; i < 150; i++) {
            const y = rand() * h;
            a.strokeStyle = '#4a290f'; a.globalAlpha = 0.22; a.lineWidth = 2 + rand() * 5;
            a.beginPath(); a.moveTo(0, y); a.lineTo(w, y); a.stroke();
          }
          a.globalAlpha = 1;
        }
      }),
      woodTeak: createHybridMaterial(null, {
        repeatX: 1, repeatY: 1, normalScale: 2.6,
        draw: (a, b, r, w, h) => {
          const rand = seededRand(503);
          a.fillStyle = '#a96930'; a.fillRect(0, 0, w, h);
          b.fillStyle = '#929292'; b.fillRect(0, 0, w, h);
          r.fillStyle = '#747474'; r.fillRect(0, 0, w, h);

    function createRoundedBox(w, h, d, r = 0.03, bevel = 0.012) {
      const s = new THREE.Shape();
      const hw = (w - bevel * 2) / 2, hh = (d - bevel * 2) / 2, rad = Math.min(r, hw * 0.45, hh * 0.45);
      s.moveTo(-hw + rad, -hh); s.lineTo(hw - rad, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + rad);
      s.lineTo(hw, hh - rad); s.quadraticCurveTo(hw, hh, hw - rad, hh);
      s.lineTo(-hw + rad, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - rad);
      s.lineTo(-hw, -hh + rad); s.quadraticCurveTo(-hw, -hh, -hw + rad, -hh);
      const geo = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.005, h - bevel * 2), bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 8 });
      geo.rotateX(-Math.PI / 2); geo.center();
      return geo;
    }

    function createSineCurtain(width, height, folds = 14, depth = 0.04) {
      const geo = new THREE.PlaneGeometry(width, height, 48, 12);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const nx = (pos.getX(i) + width / 2) / width;
        const ny = (height / 2 - pos.getY(i)) / height;
        pos.setZ(i, Math.sin(nx * Math.PI * 2 * folds) * depth * (0.45 + 0.55 * ny));
      }
      geo.computeVertexNormals();
      return geo;
    }

    function addPart(p, geo, mat, x, y, z, cast = true, receive = true) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = receive;
      p.add(m);
      return m;
    }

    const colliders = [];
    const curtainMeshes = [];
    const H = 2.95;

    function addBox(w, h, d, x, y, z, mat, collide = true, cast = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true;
      scene.add(m);
      if (collide) colliders.push(new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, y, z), new THREE.Vector3(w, h, d)));
      return m;
    }

    function placeProp(group, x, y, z, rotY = 0, colSize = null) {
      group.position.set(x, y, z); group.rotation.y = rotY;
      scene.add(group);
      group.traverse(o => { if (o.isMesh && o.name === 'curtainSheer') curtainMeshes.push(o); });
      if (colSize) {
        colliders.push(new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, y + colSize[1] / 2, z), new THREE.Vector3(colSize[0], colSize[1], colSize[2])));
      }
    }

    function buildHangingCabinet(width = 2.4, openRack = true) {
      const g = new THREE.Group(), h = 0.88, d = 0.36;

      addPart(g, new THREE.BoxGeometry(closedW, h, d), mats.matteWhite, cx, 0, 0);
      const doorW = (closedW - 0.06) / 2;
      for (const side of [-1, 1]) {
        const dx = cx + side * (doorW / 2 + 0.012);
        addPart(g, new THREE.BoxGeometry(doorW, h - 0.04, 0.022), mats.matteWhite, dx, 0, d / 2 + 0.008);
        addPart(g, new THREE.BoxGeometry(doorW - 0.07, h - 0.12, 0.016), mats.darkGlass, dx, 0, d / 2 + 0.018);

      }
      if (openRack && openW > 0.25) {
        const ox = -width / 2 + openW / 2;
        addPart(g, new THREE.BoxGeometry(openW, 0.024, d), mats.matteWhite, ox, -h / 2 + 0.012, 0);
        addPart(g, new THREE.BoxGeometry(openW, 0.024, d), mats.matteWhite, ox, 0, 0);

        addPart(g, new THREE.BoxGeometry(0.024, h, d), mats.matteWhite, ox - openW / 2 + 0.012, 0, 0);
        const cols = [0xd97b29, 0x3b8c52, 0xc93b3b, 0x7b4ca8, 0xe2b73b];
        for (let r = 0; r < 2; r++) {
          const by = r === 0 ? -h / 2 + 0.024 : 0.012;

        pt.castShadow = true;
        pt.shadow.mapSize.set(2048, 2048);
        pt.shadow.bias = -0.0005;
        pt.shadow.normalBias = 0.025;
      }
      scene.add(pt);
    }
    addRoomLight(0.0, 4.5, 0xf2f6fc, 4.0, 10.5, true);
    addRoomLight(0.65, -2.2, 0xfff0d6, 3.8, 10.5, false);
    addRoomLight(-4.2, -3.8, 0xfff1d8, 4.4, 11.0, true, 2.52);
    addRoomLight(-4.5, 4.1, 0xffe8c2, 2.6, 7.8, false, 2.60);

    // =========================================================================
    // 6. AUDIO HIBRID 48kHz WAV + FALLBACK WEB AUDIO SINTESIS
    // =========================================================================
    let audioCtx = null;
    let audioMuted = false;
    const wavBuffers = {};
    let ambientStarted = false;
    let ambientGain = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        ['tile', 'terracotta', 'wood', 'cement'].forEach(surf => {
          fetch(`./hd_pack/footstep_${surf}.wav`).then(r => r.ok ? r.arrayBuffer() : null).then(buf => {
            if (buf && audioCtx) audioCtx.decodeAudioData(buf, decoded => { wavBuffers[surf] = decoded; });
          }).catch(() => {});
        });
        fetch('./hd_pack/ambient_room.wav').then(r => r.ok ? r.arrayBuffer() : null).then(buf => {
          if (buf && audioCtx && !ambientStarted) {
            audioCtx.decodeAudioData(buf, decoded => {
              ambientStarted = true;
              const src = audioCtx.createBufferSource();
              src.buffer = decoded; src.loop = true;
              ambientGain = audioCtx.createGain();
              ambientGain.gain.value = audioMuted ? 0 : 0.25;
              src.connect(ambientGain); ambientGain.connect(audioCtx.destination);
              src.start();
            });
          }
        }).catch(() => {});
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playFootstep(surface) {
      if (audioMuted || !audioCtx) return;
      if (wavBuffers[surface]) {
        const s = audioCtx.createBufferSource();
        s.buffer = wavBuffers[surface];
        const g = audioCtx.createGain(); g.gain.value = 0.35;
        s.connect(g); g.connect(audioCtx.destination);
        s.start();
        return;
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      const f = surface === 'tile' ? 210 : surface === 'wood' ? 110 : surface === 'cement' ? 145 : 165;
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.06);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.07);
    }

    // =========================================================================
    // 7. KAWALAN FIRST-PERSON + COLLISION + HEAD-BOB + LOOP
    // =========================================================================
    const ZONES = {
      dapur: { label: 'Zon 1 · Dapur', surf: 'tile', surfLabel: 'Jubin Berkilat', pos: [0.15, 1.62, 3.65, Math.PI * 0.96] },
      tengah: { label: 'Zon 2 · Ruang Tengah & Kerja', surf: 'terracotta', surfLabel: 'Terracotta Geometri', pos: [0.65, 1.62, -1.45, 0.15] },
      tamu: { label: 'Zon 3 · Ruang Tamu Utama', surf: 'tile', surfLabel: 'Jubin Berkilat', pos: [-3.2, 1.62, -4.15, Math.PI / 2] },
      koridor: { label: 'Zon 4 · Koridor & Bilik Air', surf: 'wood', surfLabel: 'Urat Kayu Kelabu', pos: [-4.2, 1.62, 2.55, Math.PI] }
    };

    function getZoneAt(x, z) {
      if (x < -3.2 && z >= 1.5) return z > 5.45 ? { id: 'koridor', label: 'Zon 4 · Bilik Air Belakang', surf: 'cement', surfLabel: 'Simen Basuhan' } : { id: 'koridor', ...ZONES.koridor };
      if (z >= 1.5) return { id: 'dapur', ...ZONES.dapur };
      if (x < -1.6) return { id: 'tamu', ...ZONES.tamu };
      return { id: 'tengah', ...ZONES.tengah };
    }

    const player = { pos: new THREE.Vector3(0.15, 1.62, 3.65), targetYaw: Math.PI * 0.96, yaw: Math.PI * 0.96, targetPitch: -0.04, pitch: -0.04, speed: 3.0, walkPhase: 0, stepAccum: 0 };
    const keys = {}, joyVec = { x: 0, y: 0 };
    const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _delta = new THREE.Vector3();
    const _pBox = new THREE.Box3(), _pSize = new THREE.Vector3(0.56, 1.52, 0.56), _pCenter = new THREE.Vector3();

    function collides(x, z) {
      _pCenter.set(x, 0.9, z);
      _pBox.setFromCenterAndSize(_pCenter, _pSize);
      for (let i = 0; i < colliders.length; i++) if (_pBox.intersectsBox(colliders[i])) return true;
      return false;
    }

    const zoneEl = document.getElementById('zoneText');
    const surfEl = document.getElementById('surfaceText');
    const mapPlayerEl = document.getElementById('mapPlayer');
    let lastZoneText = '';

    function syncHud() {
      const z = getZoneAt(player.pos.x, player.pos.z);
      if (z.label !== lastZoneText) {
        lastZoneText = z.label;
        zoneEl.textContent = z.label;
        surfEl.textContent = z.surfLabel;
        document.querySelectorAll('.dock-btn[data-zone]').forEach(b => b.classList.toggle('active', b.dataset.zone === z.id));
      }
      const mx = ((player.pos.x + 7.0) / 10.4) * 116 + 2;
      const my = ((player.pos.z + 6.8) / 14.2) * 144 + 3;
      const deg = (-player.yaw * 180) / Math.PI;
      mapPlayerEl.setAttribute('transform', `translate(${mx.toFixed(1)}, ${my.toFixed(1)}) rotate(${deg.toFixed(1)})`);
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyH') document.getElementById('dockBar').classList.toggle('hidden');
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; joyVec.x = joyVec.y = 0; });

    renderer.domElement.addEventListener('click', () => {
      unlockAudio();
      if (window.innerWidth > 768 && document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock?.();
    });
    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement === renderer.domElement) {
        player.targetYaw -= e.movementX * 0.0022;
        player.targetPitch = THREE.MathUtils.clamp(player.targetPitch - e.movementY * 0.0022, -1.32, 1.32);
      }
    });

    document.querySelectorAll('.dock-btn[data-zone]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        unlockAudio();
        const [x, y, z, yaw] = ZONES[btn.dataset.zone].pos;
        player.pos.set(x, y, z);
        player.targetYaw = player.yaw = yaw;
        player.targetPitch = player.pitch = 0;
        syncHud();
      });
    });

    document.getElementById('dockToggle').addEventListener('click', e => {
      e.stopPropagation();
      const bar = document.getElementById('dockBar');
      bar.classList.toggle('hidden');
      e.currentTarget.textContent = bar.classList.contains('hidden') ? '▴ Buka Kawalan (H)' : '▾ Tutup Kawalan (H)';
    });

    document.getElementById('btnMute').addEventListener('click', e => {
      e.stopPropagation();
      unlockAudio();
      audioMuted = !audioMuted;
      if (ambientGain && audioCtx) ambientGain.gain.setTargetAtTime(audioMuted ? 0 : 0.25, audioCtx.currentTime, 0.08);
      e.currentTarget.textContent = audioMuted ? 'Audio: Senyap' : 'Audio: Hidup';
    });

    // Touch Joystick + Camera Look
    const joyZone = document.getElementById('joyZone'), joyKnob = document.getElementById('joyKnob');
    let joyId = null;
    function updateJoy(t) {
      const r = joyZone.getBoundingClientRect();
      const dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
      const maxR = 36, dist = Math.min(Math.hypot(dx, dy), maxR), ang = Math.atan2(dy, dx);
      const kx = Math.cos(ang) * dist, ky = Math.sin(ang) * dist;
      joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;
      joyVec.x = kx / maxR; joyVec.y = ky / maxR;
    }
    joyZone.addEventListener('touchstart', e => { unlockAudio(); joyId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); }, { passive: false });
    joyZone.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === joyId) updateJoy(t); e.preventDefault(); }, { passive: false });
    const endJoy = e => { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyVec.x = joyVec.y = 0; joyKnob.style.transform = 'translate(0,0)'; } };
    joyZone.addEventListener('touchend', endJoy); joyZone.addEventListener('touchcancel', endJoy);

    const lookZone = document.getElementById('lookZone');
    let lookId = null, lx = 0, ly = 0;
    lookZone.addEventListener('touchstart', e => { unlockAudio(); lookId = e.changedTouches[0].identifier; lx = e.changedTouches[0].clientX; ly = e.changedTouches[0].clientY; });
    lookZone.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) if (t.identifier === lookId) {
        player.targetYaw -= (t.clientX - lx) * 0.0048;
        player.targetPitch = THREE.MathUtils.clamp(player.targetPitch - (t.clientY - ly) * 0.0048, -1.32, 1.32);
        lx = t.clientX; ly = t.clientY;
      }
    });
    const endLook = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
    lookZone.addEventListener('touchend', endLook); lookZone.addEventListener('touchcancel', endLook);

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (composer) composer.setSize(w, h);
      if (ssaoPass) ssaoPass.setSize(w, h);
      if (bloomPass) bloomPass.resolution.set(w, h);
    });

    const clock = new THREE.Clock();
    function afterDraw(cb) {
      const gl = renderer.getContext();
      if (typeof gl.fenceSync === 'function') {
        const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        const poll = () => {
          if (gl.getSyncParameter(sync, gl.SYNC_STATUS) === gl.UNSIGNALED) setTimeout(poll, 5);
          else { gl.deleteSync(sync); setTimeout(cb, 80); }
        };
        setTimeout(poll, 5);
      } else {
        setTimeout(cb, 80);
      }
    }

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      for (let i = 0; i < curtainMeshes.length; i++) curtainMeshes[i].rotation.x = Math.sin(t * 1.1 + i) * 0.012;

      player.yaw = THREE.MathUtils.damp(player.yaw, player.targetYaw, 18, dt);
      player.pitch = THREE.MathUtils.damp(player.pitch, player.targetPitch, 18, dt);

      let mz = 0, mx = 0;
      if (keys.KeyW || keys.ArrowUp) mz -= 1;
      if (keys.KeyS || keys.ArrowDown) mz += 1;
      if (keys.KeyA || keys.ArrowLeft) mx -= 1;
      if (keys.KeyD || keys.ArrowRight) mx += 1;
      mx += joyVec.x; mz += joyVec.y;

      const len = Math.hypot(mx, mz);
      if (len > 0.05) {
        const sc = len > 1 ? 1 / len : 1;
        _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        _rgt.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        _delta.set(0, 0, 0).addScaledVector(_fwd, -mz * sc).addScaledVector(_rgt, mx * sc).multiplyScalar(player.speed * dt);
        if (!collides(player.pos.x + _delta.x, player.pos.z)) player.pos.x += _delta.x;
        if (!collides(player.pos.x, player.pos.z + _delta.z)) player.pos.z += _delta.z;
        player.walkPhase += dt * (player.speed * 3.1);
        player.stepAccum += _delta.length();
        if (player.stepAccum >= 0.62) {
          player.stepAccum = 0;
          playFootstep(getZoneAt(player.pos.x, player.pos.z).surf);
        }
        syncHud();
      }

      const bob = len > 0.05 ? Math.sin(player.walkPhase) * 0.032 : 0;
      camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
      camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

      if (isSoftwareGl || !composer) renderer.render(scene, camera);
      else composer.render();

      if (isSoftwareGl) afterDraw(tick);
      else requestAnimationFrame(tick);
    }

    syncHud();
    tick();
  </script>
</body>
</html>
